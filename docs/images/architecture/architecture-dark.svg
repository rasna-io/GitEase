<title id="t">GitEase architecture</title>
<desc id="d">QML views talk to controllers. Controllers use the Git layer, which wraps libgit2, libssh2 and OpenSSL, the terminal sessions, and the plugin manager, which loads C++ and QML plugins.</desc>
